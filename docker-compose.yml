name: bank-fraud-sim

x-app: &app
  build: .
  image: bank-fraud-sim:latest
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  LOG_LEVEL: INFO
  # Shared by generator (scenario eligibility) and detector (rule threshold)
  RULE_LARGE_MIN_HISTORY: "5"

services:
  # --- Apache Kafka, single node, KRaft mode (no ZooKeeper) -------------------
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "29092:29092"     # for clients running on the host
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # --- One-shot topic creation ----------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in transactions transactions.approved transactions.declined transactions.completed \
                 fraud.alerts cards.blocked cards.reissued; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # --- Kafka UI: http://localhost:8080 ---------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bank-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Python services -------------------------------------------------------
  generator:
    <<: *app
    command: ["python", "-m", "bank_sim.generator"]
    environment:
      <<: *app-env
      GEN_USERS: "150"
      GEN_MEAN_INTERVAL_S: "1.0"     # mean time between arrivals (exponential)
      GEN_FRAUD_PROBABILITY: "0.05"  # share of arrivals that start a fraud scenario
      GEN_MIN_GAP_S: "65"            # min gap between one user's normal transactions
      GEN_REISSUE_DELAY_S: "20"      # bank sends a new card this long after a block

  fraud-detector:
    <<: *app
    command: ["python", "-m", "bank_sim.fraud_detector"]
    environment:
      <<: *app-env
      RULE_CITY_HOP_WINDOW_S: "120"
      RULE_CITY_HOP_MIN_TX: "3"
      RULE_CITY_HOP_MIN_CITIES: "2"  # "not all in the same city"; set 3 for "all different"
      RULE_RAPID_WINDOW_S: "30"
      RULE_RAPID_MIN_TX: "3"
      RULE_LARGE_MULTIPLIER: "10"

  bank-processor:
    <<: *app
    command: ["python", "-m", "bank_sim.bank_processor"]
    environment:
      <<: *app-env
